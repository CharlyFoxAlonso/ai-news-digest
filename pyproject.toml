[project]
name = "ai-news-digest"
version = "0.1.0"
description = "Automated AI and hardware news digest built with Python, Gemini, RSS feeds, Gmail SMTP and GitHub Actions."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "feedparser>=6.0.12,<7",
  "google-genai>=1.56,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "rapidfuzz>=3.14,<4",
  "structlog>=25.5,<26",
  "tenacity>=9.1,<10",
]

[project.scripts]
ai-news-digest = "ai_news.__main__:main"

[dependency-groups]
dev = [
  "aiosmtpd>=1.4.6,<2",
  "freezegun>=1.5,<2",
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.0,<8",
  "pyyaml>=6.0,<7",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["ai_news"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
packages = ["ai_news"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true
